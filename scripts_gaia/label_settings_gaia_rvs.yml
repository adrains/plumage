# This file contains the common set of parameters used to adopt labels for the
# Gaia + APOGEE crossmatch. Stars passing these quality cuts have the 
# *potential* to be included in the training sample, but might still be
# excluded for scope reasons.
#
# This is part of a series of Cannon scripts in scripts_gaia:
#   1) collate_spectra_gaia_rvs.py
#   2) prepare_training_sample_gaia_rvs.py
#   3) train_stannon_gaia_rvs.py
#   4) make_stannon_diagnostics_gaia_rvs.py
#   4) run_stannon_gaia_rvs.py
#
# Where the values in this file currently apply to 2).
#
# YAML specifications: https://yaml.org/spec/1.2.2/

#------------------------------------------------------------------------------
# Fits files
#------------------------------------------------------------------------------
fits_folder: "spectra"
fits_fn_base: "rvs_spectra"
fits_label: "APOGEE_DR17"

#------------------------------------------------------------------------------
# Gaia + RVS spectra Quality Cuts
#------------------------------------------------------------------------------
# Whether we enforce a cut on RUWE
ruwe_threshold: 1.4
enforce_ruwe: True

# Spectra quality cuts
min_rvs_snr: 100

# Parallax quality cuts
min_gaia_parallax_over_error: 20
allow_negative_parallaxes: False

# Whether to mask emission fetures
do_mask_Ca_emission: True
emission_sigma_to_mask: 2
Ca_triplet_windows:
#  - [850.0, 850.1]
  - [854.4, 854.5]
#  - [866.4, 866.5]
wing_width_nm: 0.05

#------------------------------------------------------------------------------
# APOGEE Quality Cuts
#------------------------------------------------------------------------------
# Spectra quality cuts
min_apogee_snr: 100
max_apogee_vsini: 25

# Parameter uncertainties

# APOGEE flags
APOGEE_ASPCAPFLAG: 1
APOGEE_PARAMFLAG: 1
APOGEE_STARFLAG: 1
APOGEE_RV_FLAG: 1

# We ensure that these APOGEE parameters flags == 0. Note that doing this for
# the logg flag removes anything spectroscopically identified as RGB or RC.
param_flags_to_check: ["TEFF_FLAG",]

#------------------------------------------------------------------------------
# Abundance Priorities + abundances to determine labels for
#------------------------------------------------------------------------------
# Abundance labels to compute, e.g. ['Fe_H', 'Ti_Fe'].
base_labels: ["teff", "logg", "Fe_H",]
abundance_labels: ["Ti_Fe", "Ca_Fe", "Si_Fe",]